      <ul>
        <li><a href="index.html">Home</a></li>

        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>

  <main>

    <!-- Page title -->
    <section class="page-intro">
      <h1>Contact Me</h1>
      <p>Feel free to reach out about projects, events, or anything tech.</p>
    </section>

    <p class="divider">✦ ✦ ✦</p>

    <section class="section">
      <div class="container contact-grid">

        <!-- Contact details -->
        <article class="card">
          <h3>Get in Touch</h3>
          <ul class="contact-list">
            <li><span class="label">Email</span> <a href="mailto:[EMAIL]">[EMAIL]</a></li>
            <!-- remove this line if you don't want to show your phone -->
            <li><span class="label">Phone</span> <a href="tel:[PHONE]">[PHONE]</a></li>
            <li><span class="label">GitHub</span> <a href="[GITHUB LINK]" target="_blank">[GITHUB LINK]</a></li>
            <li><span class="label">LinkedIn</span> <a href="[LINKEDIN LINK]" target="_blank">[LINKEDIN LINK]</a></li>
          </ul>
        </article>

        <!-- Contact form (Web3Forms) -->
        <article class="card">
          <h3>Send a Message</h3>
          <form action="https://api.web3forms.com/submit" method="POST" class="contact-form">
            <!-- hidden fields for Web3Forms -->
            <input type="hidden" name="access_key" value="ed513079-6133-4009-bf18-d64c99627a37">
            <input type="hidden" name="subject" value="New message from my portfolio website">
            
            <input type="hidden" name="redirect" value="https://laflimban-ui.github.io/CPIT405Portifolio/">

            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" placeholder="Write your message..." required></textarea>

            <button type="submit" class="btn">Send Message</button>
          </form>
        </article>

      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p><span class="footer-star">✦</span> &copy; 2026 [FULL NAME] · [STUDENT ID] <span class="footer-star">✦</span></p>
